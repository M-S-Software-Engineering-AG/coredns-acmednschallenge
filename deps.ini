; Modules the plugin imports that CoreDNS's go.mod doesn't pin. CI installs exactly these
; (.github/ci/setup-coredns.sh); Renovate bumps them, majors included.
; Format: <module path without /vN> = <version>

; renovate: datasource=github-tags packageName=go-acme/lego
github.com/go-acme/lego = v5.8.0
; renovate: datasource=github-tags packageName=openbao/openbao extractVersion=^api/(?<version>v.+)$
github.com/openbao/openbao/api = v2.7.1
